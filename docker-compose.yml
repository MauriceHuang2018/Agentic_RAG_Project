# Docker Compose stack for phase1-mvp.
#
# 10 services:
#   postgres      - business DB (17 tables, Alembic-managed)
#   redis         - cache / LiteLLM / LangGraph checkpointer
#   qdrant        - vector store (hybrid dense + sparse BM25)
#   litellm       - LLM gateway (model-agnostic)
#   ragflow-deepdoc - document parsing sidecar (with built-in OCR)
#   api-gateway   - FastAPI entrypoint (this Dockerfile)
#   celery-worker - async task processor (doc parsing)
#   celery-beat   - periodic tasks (drift detection)
#   prometheus    - metrics scraping
#   grafana       - dashboards
#
# Bring up:    docker compose up -d
# Tear down:   docker compose down -v   (also drops data volumes)
# Health:      docker compose ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # 01-create-databases.sql auto-creates `rag_litellm` on first start
      # (POSTGRES_DB above only auto-creates the business DB).
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_business}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"  # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: rag-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./infra/litellm_config.yaml:/app/config.yaml:ro
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      Ali_API_BASE_URL: ${Ali_API_BASE_URL}
      # Ali_EMBEDDING_BASE_URL: ${Ali_EMBEDDING_BASE_URL}
      # Workspace ID for DashScope embedding model (qwen3.7-text-embedding)
      # DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY}
      LITELLM_CONFIG_PATH: /app/config.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: "postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_LITELLM_DB:-rag_litellm}"
      # Redis prompt cache (db 3, see litellm_config.yaml cache_params.db)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/liveliness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ragflow-deepdoc:
    # Custom image — only the standalone DeepDoc Server (LitServe on port 9390).
    # Built via infra/deepdoc/Dockerfile_deepdoc_oss. Replaces the previous
    # infiniflow/ragflow:latest which depended on MySQL/ES/MinIO/Redis.
    build:
      context: ./infra/deepdoc
      dockerfile: Dockerfile_deepdoc_oss
    image: deepdoc_oss:latest
    container_name: rag-deepdoc
    restart: unless-stopped
    ports:
      - "${DEEPDOC_PORT:-9390}:9390"
    volumes:
      - deepdoc-models:/root/.cache/deepdoc:rw
    environment:
      DEEPDOC_PORT: 9390
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:9390/health\", timeout=3).status == 200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_HISTORY_DB: ${REDIS_HISTORY_DB:-4}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks_v1}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      # DeepDoc Server (independent LitServe, port 9390) — only consulted by
      # the visual_router for scanned PDFs and standalone images.
      RAGFLOW_BASE_URL: http://ragflow-deepdoc:9390
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data/documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
    command: ["python", "-m", "agentic_rag_project"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-celery-worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_HISTORY_DB: ${REDIS_HISTORY_DB:-4}
      QDRANT_HOST: qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks_v1}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      RAGFLOW_BASE_URL: http://ragflow-deepdoc:9390
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data/documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ragflow-deepdoc:
        condition: service_healthy
    command: ["celery", "-A", "agentic_rag_project.doc_processor.celery_app", "worker", "--loglevel=INFO"]

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-celery-beat
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_HISTORY_DB: ${REDIS_HISTORY_DB:-4}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DRIFT_WINDOW_DAYS: ${DRIFT_WINDOW_DAYS:-7}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.05}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "agentic_rag_project.doc_processor.celery_app", "beat", "--loglevel=INFO"]

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Rule files (alerts.yaml + future rules) loaded into
      # /etc/prometheus/rules/*.yml via the `rule_files:` glob.
      - ./infra/prometheus:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: rag-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  # Persist DeepDoc ONNX model cache so container restarts don't re-download.
  deepdoc-models:
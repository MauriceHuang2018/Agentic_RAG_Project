# Docker Compose stack for phase1-mvp.
#
# 10 services:
#   postgres      - business DB (17 tables, Alembic-managed)
#   redis         - cache / LiteLLM / LangGraph checkpointer
#   qdrant        - vector store (hybrid dense + sparse BM25)
#   litellm       - LLM gateway (model-agnostic)
#   ragflow-deepdoc - document parsing sidecar (with built-in OCR)
#   api-gateway   - FastAPI entrypoint (this Dockerfile)
#   celery-worker - async task processor (doc parsing)
#   celery-beat   - periodic tasks (drift detection)
#   prometheus    - metrics scraping
#   grafana       - dashboards
#
# Bring up:    docker compose up -d
# Tear down:   docker compose down -v   (also drops data volumes)
# Health:      docker compose ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      # M5 S1 (HIGH): `POSTGRES_USER` had a silent `:-rag` default
      # — the password had `:?`, so the user was the only thing
      # missing if `POSTGRES_PASSWORD` leaked. A misconfigured
      # `POSTGRES_USER` (unset, default applied) would silently
      # fall back to `rag` and probably still work because PG
      # bootstrap creates that user. Hardening: drop the default.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # 01-create-databases.sql auto-creates `rag_litellm` on first start
      # (POSTGRES_DB above only auto-creates the business DB).
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-rag_business}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    # M5 S5 (MEDIUM): password was on the CLI, visible via
    # `docker inspect rag-redis`. Now loaded from a config file
    # mounted read-only from the host. The `:?` guard below makes
    # `docker compose config` fail-fast when REDIS_PASSWORD is
    # unset, so a missing secret never silently starts the
    # container with an empty password.
    command: ["redis-server", "/etc/redis/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
      # Config is mount-read-only so an attacker who somehow
      # breaks into the container can't overwrite the password.
      - ./infra/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"  # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # qdrant/qdrant:latest ships neither wget, curl, nc nor python — only
      # bash. The previous wget healthcheck failed on every interval
      # (FailingStreak=8 on diag 2026-09-03), which kept `celery-worker`
      # from starting because of depends_on: service_healthy. Use bash's
      # built-in /dev/tcp pseudo-device + grep on the response body.
      # (H3 healthcheck false-positive — same root cause as api-gateway,
      # which `python -m agentic_rag_project` doesn't suffer since the
      # rag-api image is python:3.11-slim. Closed 2026-09-03.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"healthz check passed\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: rag-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./infra/litellm_config.yaml:/app/config.yaml:ro
    environment:
      # M5 S2 (HIGH): these four were bare `${VAR}` — a missing
      # env would have left an empty string in the container, which
      # is the worst possible failure mode (litellm would silently
      # use the upstream's "anonymous" quota, if any). `:?` makes
      # `docker compose config` fail-fast instead.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY required}
      Ali_API_BASE_URL: ${Ali_API_BASE_URL:?Ali_API_BASE_URL required}
      # Ali_EMBEDDING_BASE_URL: ${Ali_EMBEDDING_BASE_URL}
      # Workspace ID for DashScope embedding model (qwen3.7-text-embedding)
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:?DASHSCOPE_WORKSPACE_ID required}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY required}
      LITELLM_CONFIG_PATH: /app/config.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DATABASE_URL: "postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_LITELLM_DB:-rag_litellm}"
      # Redis prompt cache (db 3, see litellm_config.yaml cache_params.db)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # ghcr.io/berriai/litellm:main-stable ships neither wget, curl, nc nor
      # python — only bash. The previous wget healthcheck failed on every
      # interval (FailingStreak=35 on diag 2026-09-03), which kept
      # `celery-worker` from starting because of depends_on: service_healthy.
      # Use bash's built-in /dev/tcp pseudo-device; verify the response
      # body contains "I'm alive!" (the proxy's own liveliness sentinel).
      # Note `CMD-SHELL` runs under `/bin/sh` — must wrap in explicit
      # `bash -c '...'` since dash does NOT implement /dev/tcp.
      # (H3 healthcheck false-positive — closed 2026-09-03 alongside the
      # qdrant + api-gateway fixes.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/4000 && printf \"GET /health/liveliness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"I'\\''m alive\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5

  ragflow-deepdoc:
    # Custom image — only the standalone DeepDoc Server (LitServe on port 9390).
    # Built via infra/deepdoc/Dockerfile_deepdoc_oss. Replaces the previous
    # infiniflow/ragflow:latest which depended on MySQL/ES/MinIO/Redis.
    build:
      context: ./infra/deepdoc
      dockerfile: Dockerfile_deepdoc_oss
    image: deepdoc_oss:latest
    container_name: rag-deepdoc
    restart: unless-stopped
    ports:
      - "${DEEPDOC_PORT:-9390}:9390"
    volumes:
      - deepdoc-models:/root/.cache/deepdoc:rw
    environment:
      DEEPDOC_PORT: 9390
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:9390/health\", timeout=3).status == 200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      # M5 S1 (HIGH): api-gateway had `${POSTGRES_USER:-rag}` and
      # `${POSTGRES_PASSWORD}` (bare) — same hardening as the
      # postgres service. The pg_isready healthcheck at line ~42
      # had to switch to `${POSTGRES_USER}` (no fallback) for
      # consistency.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # M5 S3 (HIGH): api-gateway's credential env vars were bare
      # `${VAR}` — a misconfigured `.env` would have left the
      # container connecting to redis / litellm / ragflow with an
      # empty API key, which would fail closed at first call but
      # leave the secret shape exposed in any debug dump. `:?`
      # forces the operator to set them.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_HISTORY_DB: ${REDIS_HISTORY_DB:-4}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks_v1}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY required}
      # Model routing — env override slots for `infra/litellm_config.yaml#roles.*`.
      # Defaults inside the container come from `Settings._LITELLM_ROLES`,
      # which reads the YAML at module import. Passing them explicitly here
      # as well gives ops a single docker-compose surface to swap models
      # without rebuilding the image, AND keeps the YAML in sync (these
      # values must be `model_name`s registered in `model_list`).
      # `provider/name` form required: the rag-api's litellm Python client
      # refuses bare names with `LLM Provider NOT provided`. See
      # infra/litellm_config.yaml header for the full naming rationale.
      # Closed 2026-09-02.
      LITELLM_MODEL: openai/qwen3.7-plus
      LITELLM_LONG_CONTEXT_MODEL: openai/deepseek-v4-flash-0731
      # Embedding stays bare — `doc_processor/embedder.py` hits the proxy's
      # /v1/embeddings endpoint via httpx with the bare name in the JSON
      # body, no `provider/` prefix needed.
      LITELLM_EMBEDDING_MODEL: text-embedding-v4
      # Classifier budget — feeds into LLMClassifier(timeout_seconds=...)
      # at module construction. docker compose does NOT auto-inject .env
      # vars that aren't referenced here, so we MUST wire this through
      # for the .env override to reach the container. Default 30s
      # accommodates qwen3.7-plus reasoning-mode + the long classifier
      # system prompt; 10s was too tight and surfaced as APITimeoutError
      # → keyword fallback → empty /chat/query answer (diag 2026-09-03).
      ROUTER_CLASSIFIER_TIMEOUT_SECONDS: ${ROUTER_CLASSIFIER_TIMEOUT_SECONDS:-30}
      # DeepDoc Server (independent LitServe, port 9390) — only consulted by
      # the visual_router for scanned PDFs and standalone images.
      RAGFLOW_BASE_URL: http://ragflow-deepdoc:9390
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?RAGFLOW_API_KEY required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data/documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
    command: ["python", "-m", "agentic_rag_project"]
    healthcheck:
      # python:3.11-slim ships NEITHER wget NOR curl, so the prior
      # `wget -qO- ... | grep` form exited 127 ("wget: not found")
      # on every interval (FailingStreak=80+ on diag 2026-09-03),
      # which kept `celery-worker` / `celery-beat` from starting
      # via `depends_on: service_healthy`. Use bash's built-in
      # /dev/tcp pseudo-device + grep on the response payload. Note
      # `CMD-SHELL` runs the command under `/bin/sh`, NOT `bash`,
      # so the inner `/dev/tcp/...` redirect MUST be wrapped in an
      # explicit `bash -c '...'` — dash (the typical /bin/sh) does
      # not implement /dev/tcp at all. (H3 healthcheck false-positive
      # — closed 2026-09-03 alongside the qdrant + litellm fixes.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"\\\"status\\\":\\\"ok\\\"\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-celery-worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      # M5 S3 (HIGH): celery-worker shares api-gateway's hardening.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_HISTORY_DB: ${REDIS_HISTORY_DB:-4}
      QDRANT_HOST: qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks_v1}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY required}
      RAGFLOW_BASE_URL: http://ragflow-deepdoc:9390
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?RAGFLOW_API_KEY required}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data/documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ragflow-deepdoc:
        condition: service_healthy
    command: ["celery", "-A", "agentic_rag_project.doc_processor.celery_app", "worker", "--loglevel=INFO"]

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-celery-beat
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      # M5 S3 (HIGH): celery-beat doesn't talk to LLM providers,
      # but it still needs DB + Redis credentials to run drift
      # detection queries.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-rag_business}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_HISTORY_DB: ${REDIS_HISTORY_DB:-4}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DRIFT_WINDOW_DAYS: ${DRIFT_WINDOW_DAYS:-7}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.05}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "agentic_rag_project.doc_processor.celery_app", "beat", "--loglevel=INFO"]

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Rule files (alerts.yaml + future rules) loaded into
      # /etc/prometheus/rules/*.yml via the `rule_files:` glob.
      - ./infra/prometheus:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: rag-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # M5 S4 (LOW but real): grafana defaults to `admin/admin` —
      # if the operator forgot to set GRAFANA_ADMIN_PASSWORD, the
      # dashboard came up with the well-known default. Drop the
      # `:-admin` fallback; the CI guard (T7) catches a deploy
      # without this set.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  # Persist DeepDoc ONNX model cache so container restarts don't re-download.
  deepdoc-models:
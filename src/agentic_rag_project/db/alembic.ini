# Alembic configuration for phase1-mvp.
#
# Lives inside the `db` package so migrations are colocated with models
# and the package remains self-contained (no relative-path surprises).
# Run migrations via:
#   uv run alembic -c src/agentic_rag_project/db/alembic.ini upgrade head
#   uv run alembic -c src/agentic_rag_project/db/alembic.ini downgrade base

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../../..
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_locations = %(here)s/migrations/versions

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
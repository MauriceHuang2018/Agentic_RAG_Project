# Prometheus alert rules for the Agentic RAG prototype (T4.3 finalization).
#
# These rules subscribe to the metrics exposed at `/metrics` (see
# `docs/observability/README.md`). The metric set is defined in
# `src/agentic_rag_project/observability/registry.py`.
#
# Severity levels:
#   - info     — informational, no paging
#   - warning  — paging on-call, business hours acceptable
#   - critical — paging on-call 24/7, requires immediate attention
#
# Runbook references:
#   Each rule carries a `runbook` label (short category like `rag/drift`)
#   which AlertManager templates (`infra/alertmanager/templates/*.tmpl`)
#   join with the wiki host. The matching `runbook_url` annotation is
#   the same URL fully expanded — humans clicking in the Prometheus UI
#   jump directly to the doc without AM round-tripping.

groups:
  - name: chat_api_health
    interval: 30s
    rules:
      - alert: ChatHighErrorRate
        expr: |
          sum(rate(chat_requests_total{status="error"}[5m]))
            /
          sum(rate(chat_requests_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
          team: rag-platform
          runbook: chat/error-rate
        annotations:
          summary: "Chat error rate above 5% for 5+ minutes"
          description: |
            Chat 5xx error rate is {{ $value | humanizePercentage }} over the
            last 5 minutes. Check FastAPI logs and recent deployments.
          runbook_url: "https://wiki.internal/runbooks/rag/chat/error-rate"

      - alert: ChatHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(chat_latency_seconds_bucket[5m]))
          ) > 8
        for: 5m
        labels:
          severity: warning
          team: rag-platform
          runbook: chat/latency
        annotations:
          summary: "Chat P99 latency above 8s"
          description: |
            End-to-end chat P99 latency is {{ $value | humanizeDuration }}
            over the last 5 minutes. Check LLM provider latency, Qdrant
            response times, and Redis cache health.
          runbook_url: "https://wiki.internal/runbooks/rag/chat/latency"

      - alert: ChatHighP50Latency
        expr: |
          histogram_quantile(
            0.50,
            sum by (le) (rate(chat_latency_seconds_bucket[5m]))
          ) > 4
        for: 10m
        labels:
          severity: warning
          team: rag-platform
          runbook: chat/latency
        annotations:
          summary: "Chat P50 latency above 4s"
          description: |
            Median chat latency has been above 4s for 10+ minutes.
            Likely a sustained degradation, not a transient spike.
          runbook_url: "https://wiki.internal/runbooks/rag/chat/latency"

  - name: retrieval_quality
    interval: 1m
    rules:
      - alert: HallucinationRateUp
        expr: |
          max by (workspace_id) (eval_hallucination_rate) > 0.15
        for: 15m
        labels:
          severity: critical
          team: rag-platform
          runbook: rag/hallucination
        annotations:
          summary: "Hallucination rate above 15% on workspace {{ $labels.workspace_id }}"
          description: |
            Hallucination rate (1 - faithfulness) is {{ $value | humanizePercentage }}
            on workspace {{ $labels.workspace_id }} over the last 15 minutes
            (3 eval-gauge refresh cycles). Investigate recent KB updates,
            embedding model changes, or retrieval regressions.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/hallucination"

      - alert: FaithfulnessDropping
        expr: |
          min by (workspace_id) (eval_faithfulness_score) < 0.7
        for: 15m
        labels:
          severity: warning
          team: rag-platform
          runbook: rag/faithfulness
        annotations:
          summary: "Faithfulness below 0.7 on workspace {{ $labels.workspace_id }}"
          description: |
            Rolling mean faithfulness has dropped below 0.7
            on workspace {{ $labels.workspace_id }}. This often
            precedes a hallucination-rate alert by one refresh
            cycle; investigate now.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/faithfulness"

      - alert: LongContextFallbackAbuse
        expr: |
          sum(rate(long_context_fallback_total[15m]))
            /
          clamp_min(sum(rate(chat_requests_total[15m])), 1)
            > 0.3
        for: 15m
        labels:
          severity: warning
          team: rag-platform
          runbook: rag/fallback
        annotations:
          summary: "Long-context fallback used in >30% of requests"
          description: |
            The long-context fallback is being triggered for
            {{ $value | humanizePercentage }} of chat requests over
            the last 15 minutes. This usually means the two-stage
            retrieval is failing confidence thresholds too often —
            check HybridSearcher scores and keyword classifier.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/fallback"

      - alert: EmbeddingCacheHitRateLow
        expr: |
          (
            sum(rate(embedding_cache_hits_total[15m]))
              /
            clamp_min(sum(rate(retrieval_requests_total[15m])), 1)
          ) < 0.3
          and
          sum(rate(retrieval_requests_total[15m])) > 0.5
        for: 15m
        labels:
          severity: info
          team: rag-platform
          runbook: infra/redis-cache
        annotations:
          summary: "Embedding cache hit rate below 30%"
          description: |
            Embedding cache hit rate is {{ $value | humanizePercentage }}
            over the last 15 minutes. Either Redis is degraded or the
            cache key namespace has churned (new embedding model?).
          runbook_url: "https://wiki.internal/runbooks/rag/infra/redis-cache"

  - name: business_kpis
    interval: 5m
    rules:
      - alert: CSATDropping
        expr: |
          min by (workspace_id) (csat_score) < 3.5
        for: 30m
        labels:
          severity: warning
          team: rag-platform
          runbook: business/csat
        annotations:
          summary: "CSAT below 3.5 on workspace {{ $labels.workspace_id }}"
          description: |
            Rolling 7-day CSAT (likes / (likes + dislikes), 1-5 scale)
            has been below 3.5 on workspace {{ $labels.workspace_id }}
            for 30+ minutes. Check recent dislike categorizations
            for a smoking gun.
          runbook_url: "https://wiki.internal/runbooks/rag/business/csat"

      - alert: DislikeAttributionSpike
        expr: |
          sum by (category_key) (rate(dislike_attribution_count[15m]))
            > 0.005
        for: 15m
        labels:
          severity: warning
          team: rag-platform
          runbook: feedback/attribution
        annotations:
          summary: "Dislike attribution spike on {{ $labels.category_key }}"
          description: |
            Category {{ $labels.category_key }} is receiving
            {{ $value }} dislikes/sec over the last 15 minutes.
            Sustained spikes usually map to a specific content /
            retrieval / tone regression.
          runbook_url: "https://wiki.internal/runbooks/rag/feedback/attribution"

      - alert: KBActivationLow
        expr: |
          min by (workspace_id) (kb_activation_rate) < 0.05
        for: 1h
        labels:
          severity: info
          team: rag-platform
          runbook: rag/kb-activation
        annotations:
          summary: "KB activation below 5% on workspace {{ $labels.workspace_id }}"
          description: |
            Only {{ $value | humanizePercentage }} of KB chunks are being
            cited. This could mean (a) the KB is empty, (b) retrieval
            is failing silently, or (c) direct answers don't reference
            chunks. Investigate before users complain about thin answers.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/kb-activation"

      - alert: OpenTicketsAccumulating
        expr: |
          sum by (status) (open_tickets_by_status{status!="resolved"})
            > 50
        for: 1h
        labels:
          severity: warning
          team: rag-platform
          runbook: business/tickets
        annotations:
          summary: "Open tickets ({{ $labels.status }}) above 50"
          description: |
            {{ $value }} tickets are currently in status
            "{{ $labels.status }}". Investigate the support queue
            or escalate to the customer-success team.
          runbook_url: "https://wiki.internal/runbooks/rag/business/tickets"

  - name: infrastructure
    interval: 30s
    rules:
      - alert: AgentNodeFailureRate
        expr: |
          sum by (node_name) (rate(agent_node_total{outcome="error"}[5m]))
            /
          clamp_min(sum by (node_name) (rate(agent_node_total[5m])), 1)
            > 0.1
        for: 5m
        labels:
          severity: warning
          team: rag-platform
          runbook: rag/agent-node
        annotations:
          summary: "Agent node {{ $labels.node_name }} failing >10%"
          description: |
            LangGraph node "{{ $labels.node_name }}" is failing
            {{ $value | humanizePercentage }} of the time over the
            last 5 minutes. Inspect agent_core logs for the recent
            failure trace.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/agent-node"

      - alert: NoChatTraffic
        expr: |
          sum(rate(chat_requests_total[10m])) == 0
        for: 15m
        labels:
          severity: warning
          team: rag-platform
          runbook: infra/no-traffic
        annotations:
          summary: "No chat traffic for 15+ minutes"
          description: |
            The application has served 0 chat requests for the last
            15 minutes. Either all traffic is blocked upstream, or
            this pod is orphaned from the load balancer.
          runbook_url: "https://wiki.internal/runbooks/rag/infra/no-traffic"

  - name: drift_events
    interval: 5m
    rules:
      - alert: DriftEventRateUp
        expr: |
          sum by (kind, metric_name) (
            rate(drift_events_total{severity="critical"}[15m])
          ) > 0
        for: 5m
        labels:
          severity: critical
          team: rag-platform
          runbook: rag/drift
        annotations:
          summary: "Critical drift on {{ $labels.kind }}/{{ $labels.metric_name }}"
          description: |
            The drift detector (T4.4) recorded one or more critical-severity
            drift events on `{{ $labels.kind }}` / `{{ $labels.metric_name }}`
            over the last 15 minutes. Inspect the `drift_alerts` table:

              SELECT * FROM drift_alerts
              WHERE kind = '{{ $labels.kind }}'
                AND metric_name = '{{ $labels.metric_name }}'
                AND severity = 'critical'
                AND triggered_at > now() - interval '1 hour'
              ORDER BY triggered_at DESC;

            Acknowledge after triage by setting `acknowledged = true`.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/drift"

      - alert: DriftEventSustained
        expr: |
          sum by (kind, metric_name) (
            rate(drift_events_total{severity=~"warning|critical"}[1h])
          ) > 0.05
        for: 30m
        labels:
          severity: warning
          team: rag-platform
          runbook: rag/drift
        annotations:
          summary: "Sustained warning/critical drift on {{ $labels.kind }}/{{ $labels.metric_name }}"
          description: |
            Warning or critical drift events have been firing for 30+
            minutes at >0.05 events/sec on
            `{{ $labels.kind }}` / `{{ $labels.metric_name }}`. Sustained
            drift usually maps to a real quality regression — page on-call.
          runbook_url: "https://wiki.internal/runbooks/rag/rag/drift"

  # M4.4 — CSAT sudden-drop alert. Fires when the rolling 1h CSAT
  # drops >10% relative to the same window one hour earlier. CSAT
  # is a per-workspace gauge (`csat_score{workspace_id=...}`),
  # updated every 60s by the L3 collector. Note: the alert uses
  # `avg_over_time` rather than bare `[1h]` so Prom has enough
  # resolution; `for: 5m` debounces single-tick noise.
  # When the previous window is 1.0 (perfect score), the division
  # naturally evaluates to NaN and the alert does NOT fire — the
  # series is dropped from the result vector.
  - name: rag_csat
    interval: 1m
    rules:
      - alert: CSATSuddenDrop
        expr: |
          (
            avg_over_time(csat_score[1h] offset 1h)
            - avg_over_time(csat_score[1h])
          )
            /
          avg_over_time(csat_score[1h] offset 1h)
            > 0.10
        for: 5m
        labels:
          severity: critical
          team: rag-platform
          runbook: rag/csat-drop
        annotations:
          summary: "CSAT dropped >10% in 1h for workspace {{ $labels.workspace_id }}"
          description: |
            Workspace {{ $labels.workspace_id }} saw CSAT fall by more
            than 10% comparing the last hour to the hour before. Check
            recent feedback comments + drift alerts for the same
            workspace.
          runbook_url: "https://wiki.internal/runbooks/rag/csat-drop"

  # M5 — Cross-tenant / cross-workspace probing-attack detector.
  # `audit_log_total{action="access_denied"}` is incremented once per
  # 401/403 emitted by the feedback / chat / rbac routes (F1+F2
  # closure, 2026-08-27). A sustained rate > 10/s for 2 minutes
  # usually means a stale-JWT scraper or a misconfigured service
  # account is hammering forbidden endpoints. `for: 2m` debounces
  # the legitimate "one user mistyped a URL twice" spike; severity
  # is `warning` rather than `critical` because individual denials
  # are expected (the auth layer is doing its job).
  - name: security_audit
    interval: 30s
    rules:
      - alert: HighAccessDeniedRate
        expr: |
          sum(rate(audit_log_total{action="access_denied"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
          team: rag-platform
          runbook: security/access-denied
        annotations:
          summary: "Access-denied rate above 10/s for 2+ minutes"
          description: |
            `audit_log_total{action="access_denied"}` is firing at
            {{ $value | humanize }} denials/sec over the last 5 minutes
            (sustained for 2+ minutes). This is almost always either
            (a) a stale-JWT scraper probing workspace boundaries or
            (b) a misconfigured service account. Inspect:

              SELECT user_id, COUNT(*), MIN(ts), MAX(ts)
              FROM audit_logs
              WHERE action = 'access_denied'
                AND ts > now() - interval '15 minutes'
              GROUP BY user_id
              ORDER BY COUNT(*) DESC
              LIMIT 20;

            If the top `user_id` is a known service account, rotate
            its JWT and update its workspace bindings. If it's an
            unknown UUID, treat as a probing attack and consider
            blocking the source IP at the load balancer.
          runbook_url: "https://wiki.internal/runbooks/rag/security/access-denied"
